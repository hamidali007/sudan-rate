
name: Build Sudan Rate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name sudan_rate .

      - name: Disable crashing Android lint task
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK with detailed log
        run: |
          set +e
          flutter build apk --release --verbose 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$RESULT"
          exit $RESULT

      - name: Upload detailed build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudan-rate-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sudan-rate-apk
          path: build/app/outputs/flutter-apk/app-release.apk
