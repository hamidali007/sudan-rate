
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم سعر السودان</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 18px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }

    h2, h3 { margin-top: 0; }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #087b45;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .secondary {
      background: #555;
      margin-bottom: 15px;
    }

    #message {
      margin: 15px 0;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .muted {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="card" id="loginBox">
    <h2>تسجيل دخول المدير</h2>

    <label>البريد الإلكتروني</label>
    <input id="email" type="email" placeholder="البريد الإلكتروني">

    <label>كلمة المرور</label>
    <input id="password" type="password" placeholder="كلمة المرور">

    <button id="loginBtn" onclick="login()">تسجيل الدخول</button>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>لوحة تحكم سعر السودان</h2>
      <p>إدارة أسعار العملات مقابل الجنيه السوداني</p>
      <button class="secondary" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div id="rates"></div>
    <div id="message"></div>
    <p class="muted" id="lastUpdate"></p>

  </div>
</div>

<script>
  const SUPABASE_URL =
    "https://oapuddsaszhnmernkowu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_gqxmW0Xk6klDzLobAWmZog_hqMV9Es0";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const names = {
    USD: "الدولار الأمريكي",
    SAR: "الريال السعودي",
    EGP: "الجنيه المصري"
  };

  function message(text, color = "#b00020") {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.color = color;
  }

  async function login() {
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    message("جارٍ تسجيل الدخول...", "#555");

    const { data, error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    btn.disabled = false;

    if (error) {
      message("تعذر تسجيل الدخول: " + error.message);
      return;
    }

    await checkAdmin(data.user);
  }

  async function checkAdmin(user) {
    const { data, error } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error || !data) {
      message("هذا الحساب ليس لديه صلاحية المدير.");
      await db.auth.signOut();
      return;
    }

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    await loadRates();
  }

  async function loadRates() {
    message("جارٍ تحميل الأسعار...", "#555");

    const { data, error } = await db
      .from("exchange_rates")
      .select("*")
      .order("currency");

    if (error) {
      message("تعذر تحميل الأسعار: " + error.message);
      return;
    }

    const area = document.getElementById("rates");
    area.innerHTML = "";

    data.forEach(rate => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = names[rate.currency] || rate.currency;

      const buyLabel = document.createElement("label");
      buyLabel.textContent = "سعر الشراء بالجنيه السوداني";

      const buyInput = document.createElement("input");
      buyInput.type = "number";
      buyInput.min = "0";
      buyInput.step = "any";
      buyInput.id = "buy_" + rate.currency;
      buyInput.value = rate.buy ?? "";

      const sellLabel = document.createElement("label");
      sellLabel.textContent = "سعر البيع بالجنيه السوداني";

      const sellInput = document.createElement("input");
      sellInput.type = "number";
      sellInput.min = "0";
      sellInput.step = "any";
      sellInput.id = "sell_" + rate.currency;
      sellInput.value = rate.sell ?? "";

      const saveButton = document.createElement("button");
      saveButton.textContent = "حفظ السعر";
      saveButton.onclick = () => saveRate(rate.currency, saveButton);

      card.append(
        title,
        buyLabel,
        buyInput,
        sellLabel,
        sellInput,
        saveButton
      );

      area.appendChild(card);
    });

    const latest = data
      .map(x => x.updated_at)
      .filter(Boolean)
      .sort()
      .pop();

    document.getElementById("lastUpdate").textContent =
      latest
        ? "آخر تحديث: " + new Date(latest).toLocaleString("ar")
        : "";

    message("تم تحميل الأسعار بنجاح", "#087b45");
  }

  async function saveRate(currency, button) {
    const buy = document.getElementById("buy_" + currency).value;
    const sell = document.getElementById("sell_" + currency).value;

    if (
      buy === "" ||
      sell === "" ||
      !Number.isFinite(Number(buy)) ||
      !Number.isFinite(Number(sell)) ||
      Number(buy) < 0 ||
      Number(sell) < 0
    ) {
      message("أدخل أسعاراً صحيحة.");
      return;
    }

    button.disabled = true;
    message("جارٍ حفظ الأسعار...", "#555");

    const { error } = await db
      .from("exchange_rates")
      .update({
        buy: Number(buy),
        sell: Number(sell),
        updated_at: new Date().toISOString()
      })
      .eq("currency", currency);

    button.disabled = false;

    if (error) {
      message("فشل الحفظ: " + error.message);
      return;
    }

    message(
      "تم حفظ سعر " + names[currency] + " بنجاح",
      "#087b45"
    );

    await loadRates();
  }

  async function logout() {
    await db.auth.signOut();
    location.reload();
  }

  async function start() {
    const { data, error } = await db.auth.getSession();

    if (error) {
      message("تعذر التحقق من الجلسة.");
      return;
    }

    if (data.session) {
      await checkAdmin(data.session.user);
    }
  }

  start();
</script>

</body>
</html>
